; Um ambiente por dispositivo. Escolha o ambiente na barra inferior do VS Code
; (ou use: pio run -e glicosimetro -t upload --upload-port /dev/cu.usbserial-XXXX)

[env]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
; a pilha BLE ocupa bastante flash, por isso a partição maior
board_build.partitions = huge_app.csv

[env:glicosimetro]
build_src_filter = +<glicosimetro.cpp>

[env:termometro]
build_src_filter = +<termometro.cpp>

[env:pressao]
build_src_filter = +<pressao.cpp>

[env:bioimpedancia]
build_src_filter = +<bioimpedancia.cpp>

; versão original, com os quatro dispositivos num único ESP32
[env:todos]
build_src_filter = +<todos.cpp>
